[project]
name = "cp_measure"
dynamic = ["version"] # version is read from the git tag by hatch-vcs
description = "cp_measure implements CellProfiler measurements in an accessible interface. "
authors = [
    {name= "Alan Munoz"},
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "scikit-image>=0.25",
    "scipy>=1.9.1",
    "centrosome>=1.3.4",
    "numpy >=1.22.1",
    "mahotas<2.0.0,>=1.4.13",
]

[project.optional-dependencies]
numba = [
    "numba>=0.59",
]
test = [
    "pytest>=8.4.2",
    "pytest-cov",
    "pytest-markdown-docs",
]
benchmark = [
    "pyarrow>=14.0",
    "tifffile>=2025.5.10",
]

[project.urls]
Homepage = "https://github.com/afermg/cp_measure"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/cp_measure/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cp_measure"]

[tool.mypy]
python_version = "3.13"  # default; nox overrides per-version via --python-version
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src/cp_measure/core"]

[dependency-groups]
dev = [
    "ruff>=0.12.1",
    "ipdb>=0.13.13",
    "jupyter>=1.0.0",
    "jupytext>=1.15.0",
    "mypy>=1.0,<1.20",
    "pathspec>=0.10",
    "nox>=2026.4.10",
]

